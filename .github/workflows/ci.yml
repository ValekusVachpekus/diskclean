name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libx11-dev \
            libegl1-mesa-dev \
            libgl1-mesa-dev \
            pkg-config

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Build release
        run: cargo build --workspace --release --locked

      - name: Verify Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'install.ps1'), [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
          $readme = Get-Content -LiteralPath README.md -Raw
          foreach ($block in [regex]::Matches($readme, '(?s)```powershell\r?\n(.*?)\r?\n```')) {
            [System.Management.Automation.Language.Parser]::ParseInput(
              $block.Groups[1].Value, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
          }
          $installDir = Join-Path $env:RUNNER_TEMP 'Disk Cleanup Install'
          & .\install.bat $installDir
          if ($LASTEXITCODE -ne 0) { throw 'Installer failed.' }
          $executable = Join-Path $installDir 'disk-cleanup.exe'
          if (-not (Test-Path -LiteralPath $executable -PathType Leaf)) {
            throw 'Installed executable is missing.'
          }
          $shortcutPath = Join-Path ([Environment]::GetFolderPath('Programs')) 'Disk Cleanup.lnk'
          if (-not (Test-Path -LiteralPath $shortcutPath -PathType Leaf)) {
            throw 'Start menu shortcut is missing.'
          }
          $shortcut = (New-Object -ComObject WScript.Shell).CreateShortcut($shortcutPath)
          if ($shortcut.TargetPath -ne $executable -or $shortcut.WorkingDirectory -ne $installDir) {
            throw 'Start menu shortcut points to the wrong location.'
          }
